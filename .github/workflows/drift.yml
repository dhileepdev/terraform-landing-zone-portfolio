name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config=backend.hcl.example
        working-directory: terraform
      - run: |
            set +e
            terraform plan -detailed-exitcode -out=drift.plan
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 0 ]; then
              DRIFT="false"
              RESOURCES="[]"
            elif [ "$EXIT_CODE" -eq 2 ]; then
              DRIFT="true"
              terraform show -json drift.plan | jq \
                '[.resource_changes[] | {address, action: .change.actions[0], type: .type}]' \
                > drift-resources.json
              RESOURCES="$(cat drift-resources.json)"
            else
              DRIFT="error"
              RESOURCES="[]"
            fi
            cat > ../drift/last-run.json <<EOF
            {
              "drift_detected": $DRIFT,
              "changed_resources": $RESOURCES,
              "last_checked": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
            EOF
        id: drift_check
        working-directory: terraform
      - run: |
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add drift/last-run.json
            git commit -m "chore: update drift detection results" || echo "no changes to commit"
            git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
