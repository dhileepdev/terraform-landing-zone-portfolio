name: Terraform CI/CD

on:
  push:
  pull_request:
    branches: ["main"]

jobs:
  validate:
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform validate
        working-directory: terraform

  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: terraform
      - run: terraform plan -out=tfplan
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_DEFAULT_REGION: ap-southeast-2
          TF_VAR_availability_zones: '["ap-southeast-2a", "ap-southeast-2b"]'
      - run: |
            echo "::group::Plan resource changes (cost estimate proxy)"
            terraform show -json tfplan | jq \
              '[.resource_changes[] | .change.actions[]] | group_by(.) | map({action: .[0], count: length})'
            echo "::endgroup::"
        working-directory: terraform

  apply:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config=backend.hcl.example
        working-directory: terraform
      - run: terraform apply -auto-approve
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-2
          TF_VAR_availability_zones: '["ap-southeast-2a", "ap-southeast-2b"]'
